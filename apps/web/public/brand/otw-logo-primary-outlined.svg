<?xml version="1.0" encoding="UTF-8"?>
<!--
  Opentechwire primary logo — for light backgrounds.

  Vector master for the PNG exports in this folder. Geometry is identical to
  ../otw-logo-primary.svg, except the two <text> runs (the `OTW` monogram in
  IBM Plex Mono 600 and the `opentechwire` wordmark in IBM Plex Sans 700) have
  been converted to <path> outlines. Nothing here depends on a font being
  installed, so every renderer — librsvg/sharp, Chromium, Illustrator, a
  printer's RIP — produces the same result.

  Outlines were shaped with HarfBuzz (the engine Chromium uses) at the fonts'
  true metrics, then CSS letter-spacing was applied per glyph: +0.02em on the
  monogram, -0.02em on the wordmark.

  viewBox is the artwork bounds (x 0..237.5, y 20..80) plus 8 units of clear
  space on every side. Keep that clear space when placing the logo.

  Regenerate if ../otw-logo-primary.svg changes — see
  ../../scripts/generate-logo-png.mjs for the procedure.
-->
