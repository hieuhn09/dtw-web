<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile menu with Exclusive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.otw{--paper:#FDFCF8;--surface:#FFFFFF;--ink:#111111;--muted:#5B5B58;--hair:#E5E2D8;--hair-2:#D8D4C6;--accent:#D4623C;--brand-navy:#1B2A52;--brand-amber:#D4623C;--ai:#3A4E8C;--startups:#3E6E80;--latest:#B0512E;--dev:#46735C;--products:#8F7238;--policy:#5A6577;background:var(--paper);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.otw.dark{--paper:#0F172A;--surface:#111C30;--ink:#E2E8F0;--muted:#94A3B8;--hair:#1E2B45;--hair-2:#243453;--brand-navy:#E2E8F0}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
.dp{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;font-size:16px;font-weight:600}
.dx{display:block;padding:11px 12px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</helmet>
<div class="otw {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: color-mix(in oklab, var(--ink) 55%, transparent)"></div>
  <nav aria-label="Menu" style="position: absolute; top: 0; right: 0; bottom: 0; width: 335px; background: var(--paper); border-left: 1px solid var(--hair); box-shadow: 0 1px 0 rgba(17,17,17,.04), 0 12px 32px -16px rgba(17,17,17,.12); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--hair)">
      <svg viewBox="0 18 270 64" style="height: 37px; width: 156px; display: block" role="img" aria-label="Opentechwire">
        <rect x="0" y="20" width="60" height="60" rx="8" style="fill: var(--brand-navy)"></rect>
        <text x="30" y="59" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="0.4" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" style="fill: var(--paper)">OTW</text>
        <text x="76" y="51" font-size="26" font-weight="700" letter-spacing="-0.5" font-family="'IBM Plex Sans',sans-serif" style="fill: var(--brand-navy)">opentechwire</text>
        <g transform="translate(76,67)" stroke-width="1.8" stroke-linecap="round" style="stroke: var(--brand-navy)"><line x1="7" y1="0" x2="24" y2="0"></line><line x1="34" y1="0" x2="51" y2="0"></line><line x1="61" y1="0" x2="78" y2="0"></line><line x1="88" y1="0" x2="105" y2="0"></line><line x1="115" y1="0" x2="132" y2="0"></line></g>
        <g transform="translate(76,67)"><circle cx="2" cy="0" r="2.5" style="fill: var(--brand-navy)"></circle><circle cx="29" cy="0" r="2.5" style="fill: var(--brand-amber)"></circle><circle cx="56" cy="0" r="2.5" style="fill: var(--brand-navy)"></circle><circle cx="83" cy="0" r="2.5" style="fill: var(--brand-navy)"></circle><circle cx="110" cy="0" r="2.5" style="fill: var(--brand-navy)"></circle><circle cx="137" cy="0" r="2.5" style="fill: var(--brand-navy)"></circle></g>
      </svg>
      <a href="Mobile-home.dc.html" aria-label="Close menu" style="width: 34px; height: 34px; border: 1px solid var(--hair); border-radius: 5px; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></a>
    </div>
    <div style="padding: 10px 8px">
      <a class="dp" href="#"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="color: var(--ai)"><path d="M8 1.5v4M8 10.5v4M1.5 8h4M10.5 8h4M3.5 3.5l2 2M10.5 10.5l2 2M12.5 3.5l-2 2M5.5 10.5l-2 2"></path></svg>AI</a>
      <a class="dp" href="#"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--startups)"><path d="M3 13L13 3M6 3h7v7"></path></svg>Startups</a>
      <a class="dp" href="#"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="color: var(--latest)"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg>Latest</a>
      <a class="dp" href="#"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--dev)"><path d="M5.5 4L2 8l3.5 4M10.5 4L14 8l-3.5 4"></path></svg>Dev</a>
      <a class="dp" href="#"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="color: var(--products)"><path d="M8 1.5l6 3v7l-6 3-6-3v-7zM2 4.5l6 3 6-3M8 7.5v7"></path></svg>Products</a>
      <a class="dp" href="#"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--policy)"><path d="M8 2v12M4 14h8M3 5h10M3 5l-2 5h4zM13 5l-2 5h4z"></path></svg>Policy</a>
      <div style="height: 1px; background: var(--hair); margin: 8px 12px"></div>
      <a class="dx" href="Exclusive-page.dc.html">Exclusive</a>
      <a class="dx" href="#">Briefing</a>
      <a class="dx" href="#">Awards</a>
      <a class="dx" href="#">Studio</a>
    </div>
    <div style="margin-top: auto; padding: 18px; border-top: 1px solid var(--hair)">
      <button type="button" style="width: 100%; padding: 12px 14px; border: 1px solid var(--hair-2); background: transparent; color: var(--ink); border-radius: 6px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Log in</button>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
